name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.9-slim

    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Flake8
        run: |
          flake8 service/ tests/ --count --statistics --max-line-length=100

      - name: Run unit tests with nosetests
        run: |
          nosetests --with-spec --spec-color --with-coverage --cover-package=service
        env:
          DATABASE_URI: "postgresql+psycopg2://postgres:postgres@postgres:5432/testdb"
          FLASK_APP: "wsgi:app"
